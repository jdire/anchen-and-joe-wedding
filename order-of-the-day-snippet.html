<!-- 
  Order of the Day Snippet — Anchen & Joe Wedding
  Self-contained timeline component (needs its own <style> block for the
  ajp- classes below — the alternating left/right layout, connecting line,
  and reveal-on-scroll animations can't be done with inline styles alone).
  Colour alternates strictly gold/blue/gold/blue down the timeline via the
  ajp-key class (key = blue variant), regardless of event importance.
-->

<!-- Google Fonts (skip if already on the page) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&amp;family=Raleway:wght@300;400;500;600&amp;display=swap" rel="stylesheet">

<style>
  .ajp-wrap { font-family:'Raleway',sans-serif; color:#252828; max-width:none; margin:0 auto; padding:40px 20px; border-top:1px solid #BF9B3A; border-bottom:1px solid #BF9B3A; }
  .ajp-title { font-family:'Cormorant Garamond',serif; font-size:clamp(1.8rem,5vw,2.8rem); font-weight:300; font-style:italic; text-align:center; display:block; margin-bottom:4px; }
  .ajp-sub { font-size:0.62rem; font-weight:500; letter-spacing:0.45em; text-transform:uppercase; color:#019CA6; text-align:center; display:block; margin-bottom:40px; }

  .ajp-div { display:flex; align-items:center; gap:14px; margin:0 auto 44px; width:280px; max-width:90%; }
  .ajp-div-line { flex:1; height:1px; background:linear-gradient(90deg,transparent,#BF9B3A 60%); }
  .ajp-div-line.r { background:linear-gradient(90deg,#BF9B3A 40%,transparent); }
  .ajp-div-gem { width:8px; height:8px; background:#BF9B3A; transform:rotate(45deg); flex-shrink:0; }
  .ajp-div-dot { width:4px; height:4px; background:#019CA6; transform:rotate(45deg); flex-shrink:0; }

  .ajp-tl { position:relative; }
  .ajp-tl-track {
    position:absolute; left:50%; top:0; bottom:0; width:1px;
    background:linear-gradient(to bottom, transparent, #BF9B3A 3%, #BF9B3A 97%, transparent);
    transform:translateX(-50%);
    transform-origin:top center;
    scale:1 0;
    transition:scale 0.6s cubic-bezier(0.22,1,0.36,1);
  }
  .ajp-tl.ajp-grown .ajp-tl-track { scale:1 1; }

  .ajp-row {
    display:flex; align-items:center; position:relative; min-height:80px; margin-bottom:2px;
    opacity:0; translate:0 18px;
    transition: opacity 0.55s ease, translate 0.55s cubic-bezier(0.22,1,0.36,1);
  }
  .ajp-row.ajp-visible { opacity:1; translate:0 0; }

  .ajp-ls, .ajp-rs { width:50%; flex-shrink:0; display:flex; align-items:center; }
  .ajp-ls { justify-content:flex-end; }
  .ajp-rs { justify-content:flex-start; }

  .ajp-icon {
    width:56px; height:56px; border-radius:50%;
    background:#F3E6C1; border:1px solid #BF9B3A;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; z-index:2; position:relative;
    scale:0; transition:scale 0.45s cubic-bezier(0.34,1.56,0.64,1) 0.15s;
  }
  .ajp-row.ajp-visible .ajp-icon { scale:1; }
  .ajp-row.ajp-key .ajp-icon { background:#D4E8E8; border-color:#017077; }
  .ajp-row.ajp-key .ajp-icon svg { stroke:#017077; }

  .ajp-arm {
    flex:0 0 44px; height:1px; background:#BF9B3A;
    scale:0 1; transition:scale 0.4s cubic-bezier(0.22,1,0.36,1) 0.25s;
  }
  .ajp-ls .ajp-arm { transform-origin:right center; }
  .ajp-rs .ajp-arm { transform-origin:left center; }
  .ajp-row.ajp-visible .ajp-arm { scale:1 1; }
  .ajp-row.ajp-key .ajp-arm { background:#017077; }

  .ajp-dot {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(45deg);
    width:10px; height:10px; background:#BF9B3A; z-index:4;
    scale:0; transition:scale 0.35s cubic-bezier(0.34,1.8,0.64,1) 0.35s;
  }
  .ajp-row.ajp-visible .ajp-dot { scale:1; }
  .ajp-row.ajp-key .ajp-dot { background:#017077; }

  .ajp-lbl { flex:1; min-width:0; }
  .ajp-ls .ajp-lbl { text-align:right; padding-right:20px; }
  .ajp-rs .ajp-lbl { text-align:left; padding-left:20px; }
  .ajp-ev { display:block; font-size:0.72rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#252828; }
  .ajp-tm { display:block; font-family:'Cormorant Garamond',serif; font-size:1.1rem; color:#BF9B3A; margin-bottom:2px; }
  .ajp-ds { display:block; font-family:'Cormorant Garamond',serif; font-size:0.88rem; font-style:italic; color:#9AA0A0; margin-top:3px; }

  @media (max-width:540px) {
    .ajp-tl-track { left:27px; transform:none; }
    .ajp-dot { left:27px !important; }
    .ajp-r .ajp-ls { width:0; overflow:hidden; }
    .ajp-r .ajp-rs { width:100%; padding-left:52px; }
    .ajp-r .ajp-rs .ajp-arm { display:none; }
    .ajp-l .ajp-rs { width:0; overflow:hidden; }
    .ajp-l .ajp-ls { width:100%; padding-left:52px; justify-content:flex-start; }
    .ajp-l .ajp-ls .ajp-arm { display:none; }
    .ajp-l .ajp-ls .ajp-icon { order:-1; }
    .ajp-l .ajp-ls .ajp-lbl { text-align:left !important; padding-right:0 !important; padding-left:20px; }
  }
</style>

        <div class="ajp-icon">

        </div>
        <div class="ajp-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BF9B3A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3h8l-2 9.5H10L8 3z"></path><line x1="12" y1="12.5" x2="12" y2="19"></line><line x1="8" y1="19" x2="16" y2="19"></line>

        <div class="ajp-arm"></div>

            <rect x="9" y="2" width="6" height="10" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="17" x2="12" y2="21"></line><line x1="8" y1="21" x2="16" y2="21"></line>

<script>
(function () {
  var tl    = document.getElementById('ajp-tl');
  var rows  = Array.from(tl.querySelectorAll('.ajp-row'));

  var tlObs = new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting) { tl.classList.add('ajp-grown'); tlObs.disconnect(); }
  }, { threshold: 0.05 });
  tlObs.observe(tl);

  var rowObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        var row = entry.target;
        var idx = rows.indexOf(row);
        setTimeout(function () { row.classList.add('ajp-visible'); }, idx * 80);
        rowObs.unobserve(row);
      }
    });
  }, { threshold: 0.2 });

  rows.forEach(function (row) { rowObs.observe(row); });
})();
</script>
